name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be re-run on demand from the Actions tab or `gh workflow run ci.yml`,
  # without an empty commit. Also the way to confirm the runner is healthy when
  # a push does not appear to have triggered anything.
  workflow_dispatch:

jobs:
  # Named "unit", not "test", because a matrix job reports one check per leg:
  # "unit (22)" and "unit (24)". The branch ruleset requires a single context
  # called "test", which the `test` job below provides.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 and 20 are both past end-of-life; 22 is the supported baseline and
        # 24 is current. See package.json engines.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Packaging contains no secrets or local config
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("/tmp/pack.json","utf8"))[0].files.map(f => f.path);
            const forbidden = /^(?:(?:CLAUDE_REVIEW_PROMPT|REVIEW)\.md$|tokens.*\.json(?:$|\.)|\.qbo-(?:token-stage|refresh-recovery|disconnect-recovery)-.*\.json(?:$|\.)|\.qbo-key(?:$|\.)|(?:\.refresh-|\.realm-authorization-).*\.lock(?:\/|$)|\.owner-lock-(?:init|reclaim)-|qbo-policy\.json(?:$|\.)|clients\.json(?:$|\.)|audit-log\/)|(?:^|\/)[^/]*\.lock(?:\/|$|\.)|(?:^|\/)(?:write-recovery|imports-journal|audit-[^/]*)\.jsonl$/;
            const bad = files.filter(p =>
              p === ".env" ||
              (p.startsWith(".env.") && p !== ".env.example") ||
              (p.startsWith(".claude/") && !p.startsWith(".claude/skills/add-qbo-company/")) ||
              forbidden.test(p)
            );
            if (bad.length) { console.error("Refusing to publish:", bad); process.exit(1); }
            console.log(`packaging clean (${files.length} files)`);
          '

  # Several durability and path-fencing branches are platform-specific. Unit
  # injection catches their logic, while this lane catches real filesystem,
  # separator, permissions, and process behavior on a supported Windows host.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - name: Syntax check
        shell: pwsh
        run: |
          Get-ChildItem src/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Tests
        run: npm test

  # The single stable context the "protect-main" ruleset requires. It exists so
  # the rule does not have to name matrix legs, which change whenever the
  # supported Node versions do; adding a version to the matrix above needs no
  # change here or in the ruleset.
  #
  # `if: always()` matters: without it this job is SKIPPED when a matrix leg
  # fails, and a skipped required check never reports, so the PR waits forever
  # instead of failing. Running always and exiting non-zero is what turns a
  # failed matrix into a failed "test" check.
  test:
    needs: [unit, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have succeeded
        # A matrix job aggregates: needs.unit.result is 'success' only when
        # every leg succeeded, and 'failure'/'cancelled'/'skipped' otherwise.
        run: |
          echo "unit result: ${{ needs.unit.result }}"
          echo "windows result: ${{ needs.windows.result }}"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
